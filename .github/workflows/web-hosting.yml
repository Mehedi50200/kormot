name: Web hosting

on:
  push:
    branches: [prod]
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site files
        run: test -f index.html && test -f css/styles.css && test -f js/main.js
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        with:
          node-version: 22
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        run: npx --yes firebase-tools@14 deploy --only hosting:web --non-interactive
